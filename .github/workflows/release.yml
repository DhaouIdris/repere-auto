name: release-image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m unittest discover -v
      - run: python scripts/http_smoke.py
      - name: Build and verify before publication
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          docker build --pull -t "$IMAGE" .
          echo "REPERE_RELEASE_IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Exercise the release image
        run: python scripts/container_smoke.py "$REPERE_RELEASE_IMAGE"
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ env.REPERE_RELEASE_IMAGE }}
          version: v0.76.0
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Publish immutable commit tag
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$REPERE_RELEASE_IMAGE"
