name: verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m unittest discover -v
      - run: node --check static/app.js
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm audit --audit-level=high
      - run: python scripts/http_smoke.py
      - run: python -m pip install -r requirements-dev.txt
      - run: pip-audit --strict --require-hashes -r requirements.lock
      - run: docker build --pull -t repere-auto:check .
      - run: python scripts/container_smoke.py repere-auto:check
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: repere-auto:check
          version: v0.76.0
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: json
          output: trivy-image.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: image-security-${{ github.sha }}
          path: trivy-image.json
          if-no-files-found: ignore
          retention-days: 14
